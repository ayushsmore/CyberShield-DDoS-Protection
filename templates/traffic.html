<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberShield - Traffic</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#070b14;color:#f5f7ff;font-family:Arial}
.container{width:95%;max-width:1450px;margin:30px auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.title{font-size:30px;font-weight:bold}
.sub{color:#8fa4c7;margin-top:7px}
.status{color:#5cff91;background:#101725;border:1px solid #293951;padding:12px 18px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.card{background:#101725;border:1px solid #293951;border-radius:14px;padding:22px}
.label{color:#8fa4c7;font-size:13px;text-transform:uppercase}
.num{font-size:36px;font-weight:bold;margin-top:8px}
.blue{color:#55c7ff}.green{color:#5cff91}.red{color:#ff5964}.yellow{color:#ffc857}
.panel{background:#101725;border:1px solid #293951;border-radius:14px;overflow:hidden}
.head{padding:20px 24px;border-bottom:1px solid #293951;display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 17px;text-align:left;border-bottom:1px solid #202d40;white-space:nowrap}
th{color:#8fa4c7;font-size:12px}
.empty{text-align:center;padding:40px;color:#8fa4c7}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.header{display:block}.status{display:inline-block;margin-top:15px}}
@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<div class="title">📡 Traffic Monitor</div>
<div class="sub">Real-time request monitoring</div>
</div>
<div class="status">● MONITORING ONLINE</div>
</div>

<div class="stats">

<div class="card">
<div class="label">Total</div>
<div class="num blue" id="total">0</div>
</div>

<div class="card">
<div class="label">Normal</div>
<div class="num green" id="normal">0</div>
</div>

<div class="card">
<div class="label">Suspicious</div>
<div class="num red" id="suspicious">0</div>
</div>

<div class="card">
<div class="label">Blocked</div>
<div class="num yellow" id="blocked">0</div>
</div>

</div>

<div class="panel">

<div class="head">
<h2>Live Traffic</h2>
<span>● REAL-TIME</span>
</div>

<div class="wrap">

<table>

<thead>
<tr>
<th>Time</th>
<th>Source IP</th>
<th>Method</th>
<th>Endpoint</th>
<th>Rate</th>
<th>Status</th>
<th>Action</th>
<th>Response</th>
</tr>
</thead>

<tbody id="table">
<tr><td colspan="8" class="empty">Loading...</td></tr>
</tbody>

</table>

</div>
</div>

</div>

<script>

function e(v){
if(v===null||v===undefined)return "";
return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function load(){

try{

const stats=await fetch("/api/real-stats",{cache:"no-store"}).then(r=>r.json());

document.getElementById("total").textContent=stats.total_requests||0;
document.getElementById("normal").textContent=stats.normal_requests||0;
document.getElementById("suspicious").textContent=stats.suspicious_requests||0;
document.getElementById("blocked").textContent=stats.rate_limited||0;

const data=await fetch("/api/real-logs",{cache:"no-store"}).then(r=>r.json());

const table=document.getElementById("table");

if(!data.length){
table.innerHTML='<tr><td colspan="8" class="empty">No traffic recorded</td></tr>';
return;
}

table.innerHTML=data.map(x=>`

<tr>
<td>${e(x.timestamp)}</td>
<td>${e(x.client_ip)}</td>
<td>${e(x.method)}</td>
<td>${e(x.path)}</td>
<td>${e(x.requests_per_sec)} req/s</td>
<td>${e(x.status)}</td>
<td>${e(x.action)}</td>
<td>${e(x.response_code)}</td>
</tr>

`).join("");

}catch(err){
console.error(err);
}

}

load();
setInterval(load,3000);

</script>

</body>
</html>
