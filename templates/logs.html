<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberShield - Logs</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#070b14;color:#f5f7ff;font-family:Arial}
.container{width:95%;max-width:1450px;margin:30px auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.title{font-size:30px;font-weight:bold}
.sub{color:#8fa4c7;margin-top:7px}
.status{color:#5cff91;background:#101725;border:1px solid #293951;padding:12px 18px;border-radius:10px}
.panel{background:#101725;border:1px solid #293951;border-radius:14px;overflow:hidden}
.head{padding:20px 24px;border-bottom:1px solid #293951;display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 17px;text-align:left;border-bottom:1px solid #202d40;white-space:nowrap}
th{color:#8fa4c7;font-size:12px}
.empty{text-align:center;padding:40px;color:#8fa4c7}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<div class="title">📋 Request Logs</div>
<div class="sub">Complete CyberShield request activity</div>
</div>
<div class="status">● LOGGING ONLINE</div>
</div>

<div class="panel">

<div class="head">
<h2>Request History</h2>
<span>LAST 100 EVENTS</span>
</div>

<div class="wrap">

<table>

<thead>
<tr>
<th>ID</th>
<th>Time</th>
<th>Source IP</th>
<th>Method</th>
<th>Endpoint</th>
<th>Rate</th>
<th>Status</th>
<th>Action</th>
<th>Response</th>
</tr>
</thead>

<tbody id="table">
<tr><td colspan="9" class="empty">Loading logs...</td></tr>
</tbody>

</table>

</div>
</div>

</div>

<script>

function e(v){
if(v===null||v===undefined)return "";
return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function load(){

try{

const r=await fetch("/api/real-logs",{cache:"no-store"});

if(r.status===401){
location.href="/login";
return;
}

const data=await r.json();

const table=document.getElementById("table");

if(!data.length){
table.innerHTML='<tr><td colspan="9" class="empty">No logs available</td></tr>';
return;
}

table.innerHTML=data.map(x=>`

<tr>
<td>${e(x.id)}</td>
<td>${e(x.timestamp)}</td>
<td>${e(x.client_ip)}</td>
<td>${e(x.method)}</td>
<td>${e(x.path)}</td>
<td>${e(x.requests_per_sec)} req/s</td>
<td>${e(x.status)}</td>
<td>${e(x.action)}</td>
<td>${e(x.response_code)}</td>
</tr>

`).join("");

}catch(err){
console.error(err);
}

}

load();
setInterval(load,3000);

</script>

</body>
</html>
